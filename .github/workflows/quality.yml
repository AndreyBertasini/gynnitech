name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Storia completa: lastmod delle sitemap = data reale dell'ultimo commit del file.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: |
          if grep -rInE "AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" . | grep -v node_modules; then
            echo "Secret found in repository. Aborting."
            exit 1
          fi
          echo "No secrets found."

      - name: Run project checks
        run: npm run check

      - name: Verify production build (include il gate SEO/i18n scripts/check-i18n-seo.ts)
        run: npm run build
