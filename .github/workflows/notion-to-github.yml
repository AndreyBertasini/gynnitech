name: Notion to GitHub Sync

on:
  schedule:
    - cron: '0 6 * * *' # Run every day at 6:00 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script (Notion -> Local)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(content): daily sync from Notion [skip ci]"
          branch: main
          file_pattern: 'src/content/ src/data/sidebar-generated.json'
          commit_user_name: "Notion Sync Bot"
          commit_user_email: "actions@github.com"
