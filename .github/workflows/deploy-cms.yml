name: Deploy CMS to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch @libsql/isomorphic-ws for Cloudflare Workers
        # esbuild resolves @libsql/isomorphic-ws via the "default" export condition → node.mjs
        # node.mjs imports the `ws` npm package which uses worker_threads.MessagePort
        # worker_threads is NOT available on CF Workers → ReferenceError at startup.
        # Fix: overwrite node.mjs with web.mjs content (native WebSocket, no worker_threads).
        run: |
          node -e "
            const fs = require('fs');
            const dir = 'node_modules/@libsql/isomorphic-ws';
            fs.writeFileSync(dir + '/node.mjs', fs.readFileSync(dir + '/web.mjs', 'utf8'));
            console.log('Patched @libsql/isomorphic-ws: node.mjs → web.mjs');
          "

      - name: Generate Payload import map
        run: npm run generate:importmap

      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
