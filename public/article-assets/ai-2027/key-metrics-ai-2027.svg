<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Metriche economiche ed energetiche nello scenario AI 2027</title>
  <desc id="desc">Schede con stime 2026 e 2027 per capex globale AI, potenza globale AI, ricavi OpenBrain, compute costs, potenza OpenBrain e quota della potenza statunitense usata dall'AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06080C"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="68" y1="136" x2="1110" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CCFF00"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.10)"/>
  <text x="70" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="30" font-weight="850" fill="#F8FAFC">Metriche chiave nello scenario</text>
  <text x="70" y="116" font-family="Inter, Arial, sans-serif" font-size="16" fill="#CBD5E1">Stime condizionali tratte da AI 2027. Valori arrotondati per lettura rapida.</text>
  <rect x="70" y="142" width="1060" height="6" rx="3" fill="url(#accent)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(70 180)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(204,255,0,0.34)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">GLOBAL AI CAPEX</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#CCFF00">1T -> 2T</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">USD, 2026 -> 2027</text>
    </g>
    <g transform="translate(440 180)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(125,211,252,0.34)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">GLOBAL AI POWER</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#7DD3FC">38 -> 60 GW</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">picco stimato</text>
    </g>
    <g transform="translate(810 180)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(249,115,22,0.34)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">RICAVI OPENBRAIN</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#FB923C">35B -> 140B</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">USD annui</text>
    </g>
    <g transform="translate(70 334)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(255,255,255,0.16)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">COMPUTE COSTS OPENBRAIN</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#F8FAFC">40B -> 100B</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">USD annui</text>
    </g>
    <g transform="translate(440 334)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(255,255,255,0.16)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">POWER OPENBRAIN</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#F8FAFC">6 -> 10 GW</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">picco stimato</text>
    </g>
    <g transform="translate(810 334)">
      <rect width="320" height="120" rx="18" fill="#0F172A" stroke="rgba(255,255,255,0.16)"/>
      <text x="24" y="34" font-size="15" font-weight="800" fill="#CBD5E1">QUOTA POTENZA USA SU AI</text>
      <text x="24" y="76" font-size="38" font-weight="900" fill="#F8FAFC">2.5% -> 3.5%</text>
      <text x="24" y="102" font-size="14" fill="#94A3B8">quota scenario 2026 -> 2027</text>
    </g>
  </g>
  <text x="70" y="540" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.62)">Fonte: ai-2027.com e Compute Forecast - rielaborazione GinnyTech</text>
</svg>
