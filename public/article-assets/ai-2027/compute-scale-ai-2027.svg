<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scala del compute nello scenario AI 2027</title>
  <desc id="desc">Grafico a barre in scala logaritmica con GPT-3, GPT-4, Agent-1 e un run da 10 alla 28 FLOP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06080C"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CCFF00"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="492" rx="24" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.10)"/>
  <text x="70" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="30" font-weight="850" fill="#F8FAFC">Training compute: ordini di grandezza</text>
  <text x="70" y="116" font-family="Inter, Arial, sans-serif" font-size="16" fill="#CBD5E1">Scala logaritmica semplificata. I valori sono tratti o sintetizzati dal racconto AI 2027.</text>

  <g transform="translate(130 156)">
    <line x1="0" y1="310" x2="920" y2="310" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <line x1="0" y1="232" x2="920" y2="232" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="154" x2="920" y2="154" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="76" x2="920" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="-62" y="315" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#94A3B8">1e23</text>
    <text x="-62" y="237" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#94A3B8">1e25</text>
    <text x="-62" y="159" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#94A3B8">1e27</text>
    <text x="-62" y="81" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#94A3B8">1e28</text>

    <g transform="translate(52 0)">
      <rect x="0" y="292" width="118" height="18" rx="9" fill="#334155"/>
      <text x="0" y="348" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#E2E8F0">GPT-3</text>
      <text x="0" y="374" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#94A3B8">3e23 FLOP</text>
    </g>
    <g transform="translate(266 0)">
      <rect x="0" y="226" width="118" height="84" rx="11" fill="#64748B"/>
      <text x="0" y="348" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#E2E8F0">GPT-4</text>
      <text x="0" y="374" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#94A3B8">2e25 FLOP</text>
    </g>
    <g transform="translate(480 0)">
      <rect x="0" y="92" width="118" height="218" rx="13" fill="#7DD3FC"/>
      <text x="0" y="348" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#E2E8F0">Agent-1</text>
      <text x="0" y="374" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#94A3B8">4e27 FLOP</text>
    </g>
    <g transform="translate(694 0)">
      <rect x="0" y="48" width="118" height="262" rx="13" fill="url(#bar)"/>
      <text x="0" y="348" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#E2E8F0">Run 2027</text>
      <text x="0" y="374" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#94A3B8">1e28 FLOP</text>
    </g>
  </g>
  <text x="70" y="496" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.62)">Fonte: ai-2027.com e Compute Forecast - rielaborazione GinnyTech</text>
</svg>
