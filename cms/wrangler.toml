# ──────────────────────────────────────────────────────────────────────────────
# Cloudflare Workers — Payload CMS (GinnyTech)
# Database: Neon PostgreSQL (serverless, compatibile Cloudflare Workers)
# Storage:  Cloudflare R2
# ──────────────────────────────────────────────────────────────────────────────

name = "gynnitech-cms"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Entry point generato da @opennextjs/cloudflare
main = ".open-next/worker.js"

# Assets statici (admin UI, JS, CSS)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ── Variabili d'ambiente ───────────────────────────────────────────────────────
[vars]
NEXT_PUBLIC_SERVER_URL = "https://gynnitech-cms.info-segwayverona-com.workers.dev"
ASTRO_SITE_URL = "https://ginnytech.it"

# ── Cloudflare R2 (object storage per media e upload) ─────────────────────────
[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "gynnitech-cms-media"

# ── Secrets (impostati via: wrangler secret put NOME_SECRET) ──────────────────
# Non mettere mai secrets in questo file! Configura con:
#   wrangler secret put PAYLOAD_SECRET
#   wrangler secret put DATABASE_URI        ← stringa di connessione Neon
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   wrangler secret put R2_ENDPOINT

# ── Ambiente di preview locale ─────────────────────────────────────────────────
[env.preview]
vars = { NEXT_PUBLIC_SERVER_URL = "http://localhost:8787" }

[[env.preview.r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "gynnitech-cms-media"
preview_bucket_name = "gynnitech-cms-media-preview"
